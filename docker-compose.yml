version: '3.8'

services:
  # Servicio de Base de Datos
  db:
    image: postgres:15-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_admin -d nest_database"]
      interval: 5s
      timeout: 5s
      retries: 5
    container_name: nest_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: NyC180717
      POSTGRES_DB: gym_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: "postgresql://admin:NyC180717@db:5432/gym_db?schema=public"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: